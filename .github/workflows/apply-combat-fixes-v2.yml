name: Apply combat fixes v2

on:
  push:
    branches:
      - fix/combat-ui-timer-tests

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combat-ui-timer-tests
          fetch-depth: 0

      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p):
              return Path(p).read_text(encoding='utf-8')
          def write(p, s):
              Path(p).write_text(s, encoding='utf-8')
          def replace(p, old, new):
              s = read(p)
              if old not in s:
                  raise SystemExit(f'Could not find patch target in {p}: {old[:120]}')
              write(p, s.replace(old, new, 1))

          # Action completion no longer requires spending the final action.
          replace('lib/combat-engine.mjs',
              'export function canEndCombat(actionsLeft) {\n  return actionsLeft === 0;\n}',
              'export function canEndCombat(actionsLeft) {\n  return Number.isFinite(actionsLeft) && actionsLeft >= 0;\n}')

          # Repeated attacks when fewer than three usable attackers remain.
          replace('app/page.tsx',
              'const times=usedAttacks.filter(id=>id===u.id).length,limit=hasAbility(u,"grimlock")&&grimlockFrenzyRound===round?3:u.id==="sun"&&board.some(x=>x?.id==="side")&&u.abilityUses>0?2:1;',
              'const times=usedAttacks.filter(id=>id===u.id).length,availableAttackers=board.filter(x=>x?.canAttack).length,fallbackLimit=availableAttackers<3?3:1,limit=hasAbility(u,"grimlock")&&grimlockFrenzyRound===round?3:u.id==="sun"&&board.some(x=>x?.id==="side")&&u.abilityUses>0?2:fallbackLimit;')

          # Solo AI also spends all three combat actions when only one/two attackers survive.
          replace('app/page.tsx',
              'let pb=[...board],live=shuffled(enemyBoard.map((x,i)=>({x,i})).filter((a):a is {x:Unit;i:number}=>!!a.x));\n    for(let n=0;n<3&&live.length;n++){const attacker=live.shift()!,target=Math.floor(Math.random()*9),beeBoost=',
              'let pb=[...board],live=shuffled(enemyBoard.map((x,i)=>({x,i})).filter((a):a is {x:Unit;i:number}=>!!a.x));\n    const repeatable=live.length<3?live.slice():[];\n    for(let n=0;n<3&&(live.length||repeatable.length);n++){const attacker=repeatable.length?repeatable[n%repeatable.length]:live.shift()!,target=Math.floor(Math.random()*9),beeBoost=')

          # Modal close controls: square and top-right, with enough room for the header control.
          css_path='app/globals.css'
          css=read(css_path)
          css += '''\n/* Final combat-fix overrides */\n.rules-modal [data-slot="dialog-close"],.log-modal [data-slot="dialog-close"]{position:absolute!important;top:12px!important;right:12px!important;width:36px!important;height:36px!important;min-width:36px!important;max-width:36px!important;padding:0!important;border-radius:4px!important;display:grid!important;place-items:center!important;background:var(--surface2)!important;color:var(--text)!important;border:1px solid var(--line)!important;z-index:50!important}\n.rules-modal,.log-modal{padding-right:56px!important}\n'''
          write(css_path,css)

          # Client timer / forfeit / selection / hover-preview changes.
          p='app/page.tsx'; s=read(p)
          s=s.replace('type OnlineTurn={round:number;activeId:string;activeName:string;yourTurn:boolean;actions:number;firstTurn:boolean};','type OnlineTurn={round:number;activeId:string;activeName:string;yourTurn:boolean;actions:number;firstTurn:boolean;turnStartedAt?:number;turnDeadline?:number;turnDuration?:number};')
          s=s.replace('type DeckSubmitResponse={ok:boolean;waiting?:boolean;error?:string};','type DeckSubmitResponse={ok:boolean;waiting?:boolean;error?:string};\ntype HoverPreview={kind:"character"|"battle";unit?:Unit;name?:string};')
          s=s.replace('  const [tacticianDisabledUntil,setTacticianDisabledUntil]=useState(0),[enemyConcealment,setEnemyConcealment]=useState<Concealment>(null),[friendlyConcealment,setFriendlyConcealment]=useState<Concealment>(null),[enemyBackupsRevealed,setEnemyBackupsRevealed]=useState(false);','  const [tacticianDisabledUntil,setTacticianDisabledUntil]=useState(0),[enemyConcealment,setEnemyConcealment]=useState<Concealment>(null),[friendlyConcealment,setFriendlyConcealment]=useState<Concealment>(null),[enemyBackupsRevealed,setEnemyBackupsRevealed]=useState(false);\n  const [turnDeadline,setTurnDeadline]=useState(0),[turnTimeLeft,setTurnTimeLeft]=useState(60),[forfeitPending,setForfeitPending]=useState(false);')
          s=s.replace('const turn=(data:OnlineTurn)=>{const newRound=data.round!==lastOnlineRound.current;','const turn=(data:OnlineTurn)=>{setTurnDeadline(data.turnDeadline??0);setTurnTimeLeft(Math.max(0,Math.ceil(((data.turnDeadline??0)-Date.now())/1000)));const newRound=data.round!==lastOnlineRound.current;')
          s=s.replace('    const left=()=>{setIsMyTurn(false);setPhase("waiting");flash("Your opponent disconnected from the room.","bad")};','    const left=()=>{setIsMyTurn(false);setPhase("waiting");setTurnDeadline(0);flash("Your opponent disconnected from the room.","bad")};\n    const matchOver=(data:{winnerId:string;loserId:string;reason:string;winnerName:string;loserName:string})=>{setTurnDeadline(0);setIsMyTurn(false);setForfeitPending(false);setWinner(data.winnerId===multiplayerSocket.id?`Victory — ${data.loserName} forfeited the match.`:`Defeat — you forfeited the match.`);setPhase("over");flash(data.winnerId===multiplayerSocket.id?`${data.loserName} forfeited. You win.`:"You forfeited the match.",data.winnerId===multiplayerSocket.id?"good":"bad")};')
          s=s.replace('multiplayerSocket.on("decks-ready",ready);multiplayerSocket.on("deployments-ready",deployed);multiplayerSocket.on("turn-state",turn);multiplayerSocket.on("combat-action",combat);','multiplayerSocket.on("decks-ready",ready);multiplayerSocket.on("deployments-ready",deployed);multiplayerSocket.on("turn-state",turn);multiplayerSocket.on("combat-action",combat);multiplayerSocket.on("match-over",matchOver);')
          s=s.replace('return()=>{multiplayerSocket.off("decks-ready",ready);multiplayerSocket.off("deployments-ready",deployed);multiplayerSocket.off("turn-state",turn);multiplayerSocket.off("combat-action",combat);','return()=>{multiplayerSocket.off("decks-ready",ready);multiplayerSocket.off("deployments-ready",deployed);multiplayerSocket.off("turn-state",turn);multiplayerSocket.off("combat-action",combat);multiplayerSocket.off("match-over",matchOver);')
          marker='  const built=useMemo(()=>deck.map(id=>allUnits.find(x=>x.id===id)!).filter(Boolean),[deck]);'
          timer='''  useEffect(()=>{\n    if(!multiplayerSocket||!isMyTurn||!turnDeadline){setTurnTimeLeft(60);return}\n    const tick=()=>setTurnTimeLeft(Math.max(0,Math.ceil((turnDeadline-Date.now())/1000)));\n    tick();\n    const id=window.setInterval(tick,250);\n    return()=>window.clearInterval(id);\n  },[multiplayerSocket,isMyTurn,turnDeadline]);\n'''
          if marker not in s: raise SystemExit('timer insertion marker missing')
          s=s.replace(marker,marker+'\n'+timer,1)
          s=s.replace('function selectAttacker(index:number){const u=board[index];if(phase!=="combat"||!u||!u.canAttack||actions===0)return;', 'function selectAttacker(index:number){const u=board[index];if(phase!=="combat"||!u||!u.canAttack||actions===0)return;if(interaction?.kind==="attack"&&interaction.actor===index){setInteraction(null);setBattlePlayed(false);flash(`${u.name} deselected.`);return}')
          s=s.replace('function activateAbility(index:number){const u=board[index];if(!u||!abilityReady(u))return;', 'function activateAbility(index:number){const u=board[index];if(interaction?.kind==="ability"&&interaction.actor===index){setInteraction(null);setBattlePlayed(false);flash(`${u?.name||"Character"} ability selection cancelled.`);return}const u=board[index];if(!u||!abilityReady(u))return;')
          s=s.replace('function playBattleCard(name:string,index:number){if(!battleWindow)return;', 'function playBattleCard(name:string,index:number){if(interaction?.cardIndex===index){setInteraction(null);setBattlePlayed(false);flash(`${name} selection cancelled.`);return}if(!battleWindow)return;')
          s=s.replace('function finishOnlineTurn(){if(!multiplayerSocket||!isMyTurn||actions!==0)return;setIsMyTurn(false);setInteraction(null);multiplayerSocket.emit("finish-turn");flash("Your attacks are complete. Waiting for the other player.","info")}', 'function finishOnlineTurn(){if(!multiplayerSocket||!isMyTurn)return;setIsMyTurn(false);setInteraction(null);setTurnDeadline(0);multiplayerSocket.emit("finish-turn");flash(actions?`Attack turn ended with ${actions} unused action${actions===1?"":"s"}.`:"Your attacks are complete. Waiting for the other player.","info")}')
          s=s.replace('  function finishOnlineReposition(){', '  function forfeitMatch(){if(!multiplayerSocket||phase==="over")return;if(forfeitPending){setForfeitPending(false);multiplayerSocket.emit("forfeit");return}setForfeitPending(true);flash("Forfeit armed. Click FORFEIT again to confirm.","bad")}\n  function finishOnlineReposition(){',1)
          s=s.replace('<button className="primary" disabled={actions!==0||onlineLocked} onClick={enemyTurn}>','<button className="primary" disabled={onlineLocked} onClick={enemyTurn}>')
          s=s.replace('<h2>{phaseHeading}</h2><p>{phaseCopy}</p>', '<h2>{phaseHeading}</h2><p>{phaseCopy}</p>{phase==="combat"&&multiplayerSocket&&isMyTurn&&<div className={`turn-timer ${turnTimeLeft<=10?"urgent":""}`} aria-label={`Turn timer: ${turnTimeLeft} seconds remaining`}><div className="timer-label"><b>{turnTimeLeft}s</b><small>TURN TIME</small></div><div className="timer-track"><div className="timer-fill" style={{width:`${Math.max(0,Math.min(100,(turnTimeLeft/60)*100))}%`}}/><span className="timer-fuse" aria-hidden="true">🔥</span></div></div>}')
          s=s.replace('{multiplayerSocket?(onlineLocked?`Waiting for ${activePlayerName}`:"Finish attack turn"):"Resolve enemy turn"}','{multiplayerSocket?(onlineLocked?`Waiting for ${activePlayerName}`:"Finish attack turn"):"Resolve enemy turn"}{multiplayerSocket&&isMyTurn&&<button className={`ghost forfeit-button ${forfeitPending?"armed":""}`} onClick={forfeitMatch}>{forfeitPending?"CONFIRM FORFEIT":"FORFEIT"}</button>}')
          old_card='return <div className={`character-card ${small?"small":""} ${used?"used":""}`}><img src={unit.image} alt={unit.name}/><div className="card-hud"><b>{unit.name}</b><span><Heart size={12}/>{unit.hp}/{unit.max}</span><span><Zap size={12}/>{unit.dmg}</span>{((unit.shield??0)>0||unit.ravageGuard)&&<span title={unit.ravageGuard?"Ravage reposition guard active":"Shield active"}><Shield size={12}/>{unit.ravageGuard?"GUARD":unit.shield}</span>}</div></div>}'
          new_card='return <div className={`character-card ${small?"small":""} ${used?"used":""}`}><img src={unit.image} alt={unit.name} onError={e=>{e.currentTarget.style.display="none"}}/><div className="card-hud"><b>{unit.name}</b><span><Heart size={12}/>{unit.hp}/{unit.max}</span><span><Zap size={12}/>{unit.dmg}</span>{((unit.shield??0)>0||unit.ravageGuard)&&<span title={unit.ravageGuard?"Ravage reposition guard active":"Shield active"}><Shield size={12}/>{unit.ravageGuard?"GUARD":unit.shield}</span>}</div><div className="card-hover-preview"><img src={unit.image} alt=""/><div><b>{unit.name}</b><span>{unit.role} · {unit.faction}</span><p>{unit.ability}</p><strong>{unit.hp}/{unit.max} HP · {unit.dmg} DMG</strong></div></div></div>}'
          if old_card not in s: raise SystemExit('character card block missing')
          s=s.replace(old_card,new_card,1)
          battle_old='{battleHand.map((name,i)=><button key={`${name}-${i}`} disabled={!battleWindow} onClick={()=>playBattleCard(name,i)} title={battleCards[name].effect}>{battleCards[name].image?<img src={battleCards[name].image} alt={name}/>:<TrapCard/>}<span>{name}</span></button>)}'
          battle_new='{battleHand.map((name,i)=><button key={`${name}-${i}`} disabled={!battleWindow} onClick={()=>playBattleCard(name,i)} title={battleCards[name].effect}>{battleCards[name].image?<img src={battleCards[name].image} alt={name}/>:<TrapCard/>}<span>{name}</span><div className="battle-hover-preview">{battleCards[name].image?<img src={battleCards[name].image} alt=""/>:<TrapCard/>}<div><b>{name}</b><span>{battleCards[name].rarity}</span><p>{battleCards[name].effect}</p></div></div></button>)}'
          if battle_old not in s: raise SystemExit('battle card block missing')
          s=s.replace(battle_old,battle_new,1)
          write(p,s)

          # Fix references for supplied new characters whose dedicated artwork is not in the repo.
          p='lib/card-data.ts'; s=read(p)
          missing=['getaway','grapple','highbrow','hoist','bludgeon','frenzy','galvatron','jhiaxus','laserbeak','ravage','rumble']
          if 'const missingArtIds' not in s:
              s=s.replace('export const rosters=', 'const missingArtIds=new Set(['+','.join(repr(x) for x in missing)+']);\nexport const rosters=',1)
          old='image:`/cards/characters/${imageNames[id]||id}.png`'
          new='image:missingArtIds.has(id)?`/cards/characters/fallback-${id}.svg`:`/cards/characters/${imageNames[id]||id}.png`'
          if old in s: s=s.replace(old,new,1)
          write(p,s)

          # Generate visible named SVG card fallbacks so missing artwork never renders as a broken image.
          rows={
          'getaway':('Getaway','AUTOBOT · TROOPER'), 'grapple':('Grapple','AUTOBOT · TACTICIAN'), 'highbrow':('Highbrow','AUTOBOT · TACTICIAN'), 'hoist':('Hoist','AUTOBOT · TACTICIAN'),
          'bludgeon':('Bludgeon','DECEPTICON · SCOUT'), 'frenzy':('Frenzy','DECEPTICON · SCOUT'), 'galvatron':('Galvatron','DECEPTICON · COMMANDER'), 'jhiaxus':('Jhiaxus','DECEPTICON · TACTICIAN'),
          'laserbeak':('Laserbeak','DECEPTICON · SCOUT'), 'ravage':('Ravage','DECEPTICON · SCOUT'), 'rumble':('Rumble','DECEPTICON · SCOUT')}
          for id_,(name,subtitle) in rows.items():
              Path(f'cards/characters/fallback-{id_}.svg').write_text(f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 768"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#122b42"/><stop offset="1" stop-color="#071019"/></linearGradient></defs><rect width="546" height="768" fill="url(#g)"/><rect x="14" y="14" width="518" height="740" rx="14" fill="none" stroke="#3aa6d5" stroke-width="4"/><text x="273" y="280" text-anchor="middle" fill="#dcefff" font-family="Arial" font-size="42" font-weight="800">{name}</text><text x="273" y="328" text-anchor="middle" fill="#79b9d6" font-family="Arial" font-size="20" font-weight="700">{subtitle}</text><text x="273" y="405" text-anchor="middle" fill="#59798d" font-family="Arial" font-size="22">NEW CARD ART</text><path d="M80 590h386M125 635h296" stroke="#2f7d9f" stroke-width="5" opacity=".5"/></svg>''',encoding='utf-8')

          # Full ability/reference coverage and asset-reference test.
          Path('tests/character-abilities.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport path from "node:path";\nimport test from "node:test";\nimport { allUnits } from "../lib/card-data.ts";\n\nconst source=fs.readFileSync(path.join(process.cwd(),"app/page.tsx"),"utf8");\n\ntest("every character has an ability and a character asset reference",()=>{\n  for(const unit of allUnits){\n    assert.ok(unit.ability.trim(), `${unit.id} has an ability`);\n    assert.match(unit.image,/^\\/cards\\/characters\\//,`${unit.id} has a character asset URL`);\n  }\n});\n\ntest("every limited-use character ability has a gameplay implementation reference",()=>{\n  for(const unit of allUnits.filter(u=>u.abilityUses>0)){\n    assert.ok(source.includes(`"${unit.id}"`),`${unit.id} is referenced by gameplay code`);\n  }\n});\n\ntest("the active ability registry contains every direct active ability",()=>{\n  for(const id of ["eject","wheeljack","soundwave","bombshell","overlord","shockwave","pmega","wasp","head","arachnia","razor","getaway","grapple","highbrow","hoist","bludgeon","jhiaxus","rumble"]){\n    assert.ok(source.includes(`"${id}"`),`${id} is registered in the active ability system`);\n  }\n});\n''',encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          TURN_DURATION_MS: 250
        run: npm test

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css server.mjs lib/combat-engine.mjs lib/card-data.ts tests/character-abilities.test.mjs cards/characters/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Fix combat actions, timer, selections and card previews [automation]"
          git push origin HEAD:fix/combat-ui-timer-tests
