name: Build playable game

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-game.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit playable export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html raid/index.html assets cards
          if git diff --cached --quiet; then
            echo "Playable export is already current."
          else
            git commit -m "Build playable GitHub Pages output [skip ci]"
            git push
          fi
