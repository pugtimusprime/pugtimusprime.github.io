<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553 774" role="img" aria-labelledby="title description">
  <title id="title">War Dawn</title>
  <desc id="description">Rare Battle Card. Choose an enemy row; everyone in it takes 15 damage.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c37"/>
      <stop offset="0.5" stop-color="#315aa0"/>
      <stop offset="0.72" stop-color="#ff684b"/>
      <stop offset="1" stop-color="#160e18"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff6b5"/>
      <stop offset="0.45" stop-color="#ffd04a"/>
