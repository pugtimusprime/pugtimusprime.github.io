    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#132844" stop-opacity="0.96"/>
    </linearGradient>
  </defs>
  <rect width="553" height="774" rx="22" fill="#050914"/>
  <rect x="9" y="9" width="535" height="756" rx="17" fill="url(#sky)" stroke="#69d4ff" stroke-width="7"/>
  <path d="M32 86H521L493 135H60Z" fill="#07101f" stroke="#69d4ff" stroke-width="4"/>
