  <circle cx="276" cy="323" r="176" fill="url(#sun)"/>
  <g fill="#fff1a8" opacity="0.44">
    <path d="M276 145L291 276H261Z"/>
    <path d="M112 216L235 292L218 317Z"/>
    <path d="M440 216L334 317L317 292Z"/>
    <path d="M70 348L225 331L229 360Z"/>
    <path d="M483 348L323 360L328 331Z"/>
